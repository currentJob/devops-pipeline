<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>남해 여행 · 쏠비치 2박 3일 (7/5–7/7)</title>
<meta name="description" content="쏠비치 남해 거점 2박 3일. 실시간 지도와 내 위치, 장소별 추천 정보.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#16343F;
    --sea:#1F6E7E;
    --sea-light:#E4EFF0;
    --yuja:#E8A83D;
    --green:#5E7F4A;
    --bg:#F4F6F5;
    --card:#FFFFFF;
    --line:#E0E7E5;
    --muted:#6B8288;
    --now:#FFF6E3;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'IBM Plex Sans KR', sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  /* ── 헤더 ── */
  .top{background:var(--card);padding:16px 20px 12px;border-bottom:1px solid var(--line)}
  .top-inner{max-width:640px;margin:0 auto}
  .top h1{font-size:1.15rem;font-weight:700}
  .top .sub{font-size:.8rem;color:var(--muted)}

  /* ── 고정: 데이칩 + 지도 ── */
  .sticky{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
  }
  .chips{max-width:640px;margin:0 auto;display:flex;gap:8px;padding:10px 16px 8px}
  .chip{
    flex:1;border:1px solid var(--line);background:var(--card);
    border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .chip .d{font-size:.92rem;font-weight:700}
  .chip .w{font-size:.68rem;color:var(--muted)}
  .chip[aria-selected="true"]{background:var(--sea);border-color:var(--sea)}
  .chip[aria-selected="true"] .d,.chip[aria-selected="true"] .w{color:#fff}
  .chip:focus-visible{outline:3px solid var(--yuja);outline-offset:2px}

  .mapwrap{max-width:640px;margin:0 auto;padding:0 16px;position:relative}
  #map{
    height:36vh;min-height:230px;max-height:340px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    z-index:1;
  }
  .locate-btn{
    position:absolute;right:26px;bottom:14px;z-index:10;
    display:flex;align-items:center;gap:6px;
    font-size:.78rem;font-weight:700;color:var(--sea);
    background:#fff;border:1.5px solid var(--sea);
    border-radius:999px;padding:8px 14px;cursor:pointer;
    box-shadow:0 2px 6px rgba(22,52,63,.18);
  }
  .locate-btn.on{background:var(--sea);color:#fff}
  .locate-btn:focus-visible{outline:3px solid var(--yuja);outline-offset:2px}
  .locate-btn svg{width:14px;height:14px;fill:currentColor}

  /* ── 일정 리스트 ── */
  main{max-width:640px;margin:0 auto;padding:14px 16px 60px}
  .dayline{font-size:.8rem;font-weight:700;color:var(--green);letter-spacing:.12em;margin:6px 4px 12px}
  .stops{display:flex;flex-direction:column;gap:10px}

  .stop{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    cursor:pointer;
    transition:border-color .15s, box-shadow .15s;
  }
  .stop.active{border-color:var(--sea);box-shadow:0 0 0 2px rgba(31,110,126,.2)}
  .stop.now{background:var(--now)}
  .row1{display:flex;align-items:center;gap:10px}
  .num{
    flex:none;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    background:var(--sea);color:#fff;border-radius:50%;
    font-size:.78rem;font-weight:700;
  }
  .stop.meal .num{background:var(--green)}
  .tt{flex:1;min-width:0}
  .tt .name{font-size:1rem;font-weight:700}
  .tt .meta{font-size:.75rem;color:var(--muted)}
  .badge-now{flex:none;font-size:.68rem;font-weight:700;color:#8A5A00;background:#F6E3BC;border-radius:999px;padding:3px 10px}
  .caret{flex:none;width:18px;height:18px;fill:var(--muted);transition:transform .2s}
  .stop.open .caret{transform:rotate(180deg)}

  /* 펼침 상세 */
  .detail{display:none;margin:10px 0 0 36px}
  .stop.open .detail{display:block}
  .note{font-size:.84rem;color:#3E565E}
  .warn{
    display:inline-block;margin-top:8px;
    font-size:.73rem;font-weight:500;color:#8A5A00;
    background:#FBF0DA;border-radius:8px;padding:2px 9px;
  }
  .sec{margin-top:10px}
  .sec .h{font-size:.72rem;font-weight:700;color:var(--sea);letter-spacing:.08em;margin-bottom:5px}
  .recs{display:flex;flex-wrap:wrap;gap:6px}
  .rec{
    font-size:.76rem;font-weight:500;
    background:var(--sea-light);color:#1D5560;
    border-radius:999px;padding:4px 11px;
  }
  .stop.meal .rec{background:#EAF0E3;color:#4A653A}
  .infos{list-style:none}
  .infos li{font-size:.78rem;color:#3E565E;padding:2px 0 2px 14px;position:relative}
  .infos li::before{
    content:"";position:absolute;left:2px;top:11px;
    width:5px;height:5px;border-radius:50%;background:var(--yuja);
  }
  .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:5px;
    font-size:.78rem;font-weight:700;
    border-radius:999px;padding:8px 14px;
    text-decoration:none;cursor:pointer;
    border:1.5px solid var(--sea);
  }
  .btn-primary{background:var(--sea);color:#fff}
  .btn-primary:active{background:#175561}
  .btn-ghost{background:transparent;color:var(--sea)}
  .btn-ghost:active{background:var(--sea-light)}
  .btn:focus-visible{outline:3px solid var(--yuja);outline-offset:2px}
  .btn svg{width:12px;height:12px;fill:currentColor}

  .foot-tip{
    max-width:640px;margin:20px auto 0;
    background:var(--sea-light);border-radius:var(--radius);
    padding:14px 16px;font-size:.8rem;color:#2A4A53;
  }
  .foot-tip b{color:var(--sea)}
  footer{text-align:center;font-size:.74rem;color:var(--muted);padding:24px 16px calc(24px + env(safe-area-inset-bottom))}

  /* Leaflet 마커 */
  .num-marker{
    display:flex;align-items:center;justify-content:center;
    width:28px;height:28px;
    background:var(--sea);color:#fff;
    border:2.5px solid #fff;border-radius:50%;
    font-family:'IBM Plex Sans KR',sans-serif;font-size:.8rem;font-weight:700;
    box-shadow:0 1px 4px rgba(22,52,63,.4);
  }
  .num-marker.meal{background:var(--green)}
  .me-marker{
    width:16px;height:16px;border-radius:50%;
    background:#2A7FFF;border:3px solid #fff;
    box-shadow:0 0 0 2px rgba(42,127,255,.4), 0 1px 4px rgba(0,0,0,.3);
  }
  .leaflet-popup-content{font-family:'IBM Plex Sans KR',sans-serif;font-size:.85rem;margin:10px 14px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

</main>

];

/* ── 지도 ── */
const map = L.map('map', { zoomControl:false }).setView([34.76, 127.99], 10);
L.control.zoom({ position:'topleft' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:18, attribution:'&copy; OpenStreetMap'
}).addTo(map);
let dayLayer = L.layerGroup().addTo(map);
let markers = {};   // stop index -> marker

const $stops = document.getElementById('stops');
const $dayline = document.getElementById('dayline');
const chips = document.querySelectorAll('.chip');
let curDay = 0;

const todayStr = new Date().toISOString().slice(0,10);
const tripIdx = TRIP_DATES.indexOf(todayStr);
if (tripIdx >= 0) curDay = tripIdx;

function gnav(s){ return 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lng; }
function nmap(s){
  return 'https://map.naver.com/p/search/' +
    encodeURIComponent(s.name.replace(/ 점심| 산책| 체크인|체크아웃 · |호텔 복귀.*/g,''));
}
function isNow(s){
  if (tripIdx !== curDay) return false;
  const now = new Date();
  const hm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  return hm >= s.t && hm <= s.end;
}

function renderMap(day){
  dayLayer.clearLayers();
  markers = {};
  const pts = [];
  day.stops.forEach((s, i) => {
    if (s.noMap) return;
    pts.push([s.lat, s.lng]);
    const icon = L.divIcon({
      className:'',
      html:'<div class="num-marker' + (s.meal?' meal':'') + '">' + (i+1) + '</div>',
      iconSize:[28,28], iconAnchor:[14,14]
    });
    const m = L.marker([s.lat, s.lng], { icon }).addTo(dayLayer)
      .bindPopup('<b>' + s.name + '</b><br>' + s.t + ' · ' + s.meta +
        '<br><a href="' + gnav(s) + '" target="_blank" rel="noopener">길찾기 →</a>');
    m.on('click', () => openCard(i, false));
    markers[i] = m;
  });
  L.polyline(pts, { color:'#1F6E7E', weight:3, dashArray:'6 8', opacity:.7 }).addTo(dayLayer);
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.18));
}

function renderList(day){
  $dayline.textContent = day.label;
  $stops.innerHTML = day.stops.map((s, i) => {
    const now = isNow(s);
    return (
    '<article class="stop' + (s.meal?' meal':'') + (now?' now':'') + '" data-i="' + i + '" id="stop-' + i + '">' +
      '<div class="row1">' +
        '<span class="num">' + (i+1) + '</span>' +
        '<div class="tt">' +
          '<div class="name">' + s.name + '</div>' +
          '<div class="meta">' + s.t + (s.end !== '23:59' ? '–' + s.end : '~') + ' · ' + s.meta + '</div>' +
        '</div>' +
        (now ? '<span class="badge-now">지금</span>' : '') +
        '<svg class="caret" viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>' +
      '</div>' +
      '<div class="detail">' +
        '<p class="note">' + s.note + '</p>' +
        (s.warn ? '<span class="warn">' + s.warn + '</span>' : '') +
        (s.recs ? '<div class="sec"><div class="h">추천</div><div class="recs">' +
          s.recs.map(r => '<span class="rec">' + r + '</span>').join('') + '</div></div>' : '') +
        (s.infos ? '<div class="sec"><div class="h">정보</div><ul class="infos">' +
          s.infos.map(t => '<li>' + t + '</li>').join('') + '</ul></div>' : '') +
        (s.lat ?
        '<div class="btns">' +
          '<a class="btn btn-primary" href="' + gnav(s) + '" target="_blank" rel="noopener">' +
            '<svg viewBox="0 0 24 24"><path d="M21.7 11.3l-9-9a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM13 14.5V12h-3v3H8v-4a1 1 0 0 1 1-1h4V7.5l3.5 3.5-3.5 3.5z"/></svg>길찾기</a>' +
          '<a class="btn btn-ghost" href="' + nmap(s) + '" target="_blank" rel="noopener">네이버 지도</a>' +
          (s.tel ? '<a class="btn btn-ghost" href="tel:' + s.tel + '">전화</a>' : '') +
        '</div>' : '') +
      '</div>' +
    '</article>');
  }).join('');

  $stops.querySelectorAll('.stop').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      openCard(+el.dataset.i, true);
    });
  });
}

/* 카드 열기: 펼침 + 지도 이동. fromCard=true면 토글 */
function openCard(i, fromCard){
  const day = DAYS[curDay];
  const s = day.stops[i];
  const el = document.getElementById('stop-' + i);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  $stops.querySelectorAll('.stop').forEach(c => c.classList.remove('active','open'));
  el.classList.add('active');
  if (!(fromCard && wasOpen)) el.classList.add('open');
  if (!fromCard) el.scrollIntoView({ behavior:'smooth', block:'center' });
  if (s.lat && markers[i]) {
    map.setView([s.lat, s.lng], 14);
    markers[i].openPopup();
  }
}

function render(){
  const day = DAYS[curDay];
  renderMap(day);
  renderList(day);
  const nowIdx = day.stops.findIndex(isNow);
  if (nowIdx >= 0) openCard(nowIdx, false);
}

chips.forEach((chip, i) => {
  chip.addEventListener('click', () => {
    chips.forEach(c => c.setAttribute('aria-selected','false'));
    chip.setAttribute('aria-selected','true');
    curDay = i;
    render();
  });
});
chips.forEach((c,i) => c.setAttribute('aria-selected', i === curDay ? 'true' : 'false'));
render();

/* sticky 영역 안에서 지도 높이가 0으로 잡히는 문제 방지: 레이아웃 확정 후 크기 재계산 */
function fixMapSize(){
  map.invalidateSize();
  const day = DAYS[curDay];
  const pts = day.stops.filter(s => !s.noMap).map(s => [s.lat, s.lng]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.18));
}
window.addEventListener('load', () => setTimeout(fixMapSize, 200));
setTimeout(fixMapSize, 400);

/* ── 내 위치 ── */
let watchId = null, meMarker = null, meCircle = null;
const locateBtn = document.getElementById('locateBtn');
locateBtn.addEventListener('click', () => {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
    if (meCircle) { map.removeLayer(meCircle); meCircle = null; }
    locateBtn.classList.remove('on');
    locateBtn.setAttribute('aria-pressed','false');
    return;
  }
  if (!('geolocation' in navigator)) {
    alert('이 브라우저는 위치 기능을 지원하지 않습니다.');
    return;
  }
  watchId = navigator.geolocation.watchPosition(pos => {
    const { latitude:lat, longitude:lng, accuracy } = pos.coords;
    if (!meMarker) {
      meMarker = L.marker([lat, lng], {
        icon: L.divIcon({ className:'', html:'<div class="me-marker"></div>', iconSize:[16,16], iconAnchor:[8,8] })
      }).addTo(map);
      meCircle = L.circle([lat, lng], { radius:accuracy, color:'#2A7FFF', weight:1, fillOpacity:.08 }).addTo(map);
      map.setView([lat, lng], 13);
    } else {
      meMarker.setLatLng([lat, lng]);
      meCircle.setLatLng([lat, lng]).setRadius(accuracy);
    }
  }, () => {
    alert('위치를 가져올 수 없습니다. 위치 권한과 HTTPS 접속을 확인해 주세요.');
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    locateBtn.classList.remove('on');
    locateBtn.setAttribute('aria-pressed','false');
  }, { enableHighAccuracy:true, maximumAge:5000 });
  locateBtn.classList.add('on');
  locateBtn.setAttribute('aria-pressed','true');
});
</script>

</body>
</html>
