# 기술 블로그 (Quartz v4) 빌드·배포.
#
# 소스 = site/content/ (vault export와 승인된 외부 게시가 함께 쓰는 공개 계층).
#   vault/ 자체는 .gitignore(비공개)라 CI 에 없고, 공개 조건을 충족한 게시본만 들어온다.
# Quartz 본체는 레포에 두지 않고 CI 에서 클론 → 우리는 site/quartz.config.ts 만 관리.
#
# 사전 1회 설정: 레포 Settings → Pages → Source 를 "GitHub Actions" 로 지정.
name: Publish vault blog

env:
  QUARTZ_COMMIT: d25a6eabf96751ffca56f8a8139272def7a65041

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/blog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1건만 — 진행 중 실행을 취소하지 않고 큐잉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch tested Quartz revision
        # 브랜치 이름만 고정하면 upstream 변경으로 같은 커밋이 다르게 빌드될 수 있다.
        run: |
          git init "$RUNNER_TEMP/quartz"
          git -C "$RUNNER_TEMP/quartz" remote add origin https://github.com/jackyzha0/quartz.git
          git -C "$RUNNER_TEMP/quartz" fetch --depth 1 origin "$QUARTZ_COMMIT"
          git -C "$RUNNER_TEMP/quartz" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/quartz" rev-parse HEAD)" = "$QUARTZ_COMMIT"

      - name: Overlay config + custom styles + published content
        run: |
          cp site/quartz.config.ts "$RUNNER_TEMP/quartz/quartz.config.ts"
          # 블로그형 레이아웃(헤더/사이드바/푸터) — quartz.layout.ts 오버레이
          cp site/quartz.layout.ts "$RUNNER_TEMP/quartz/quartz.layout.ts"
          # 모던 테크 커스텀 스타일/애니메이션 — Quartz 의 custom.scss 오버레이
          cp site/styles/custom.scss "$RUNNER_TEMP/quartz/quartz/styles/custom.scss"
          rm -rf "$RUNNER_TEMP/quartz/content"
          cp -r site/content "$RUNNER_TEMP/quartz/content"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & build
        working-directory: ${{ runner.temp }}/quartz
        run: |
          npm ci
          npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
