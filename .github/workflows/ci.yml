name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  # 코드가 그대로여도 의존성 취약점은 새로 공개된다. 게시 커밋이 우연히 CI 를 돌려
  # 주던 것을 아래에서 없애므로, 정기 감사를 명시적인 일정으로 돌린다. (월 09:00 KST)
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 블로그 게시는 site/content/ 만 건드리는데 그때마다 앱 전체 CI(테스트·이미지 빌드·
  # 스캔·레지스트리 푸시)가 돌았다. 글 한 편이 파이썬 앱을 검증할 이유는 없다.
  #
  # `on.push` 에 paths-ignore 를 다는 대신 잡 단계에서 거른다. 이 push 트리거는 태그도
  # 받는데, 경로 필터가 태그 푸시에 어떻게 적용되는지는 GitHub 문서가 정의하지 않는다
  # (조회 2026-09-22). 릴리스 태그가 조용히 걸러져 registry-push·vllm-build 가 건너뛰는
  # 쪽이 게시 커밋이 CI 를 도는 것보다 훨씬 나쁘다.
  changes:
    name: 코드 변경 판별
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 비교 기준 커밋이 얕은 클론에 없으면 판별할 수 없다.

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        # 판단이 서지 않으면 돌린다. 검사를 건너뛴 채 통과로 보고하는 것보다
        # 불필요하게 한 번 더 도는 쪽이 낫다.
        run: |
          set -uo pipefail
          run_all() { echo "code=true" >> "$GITHUB_OUTPUT"; echo "::notice::전체 CI 를 실행합니다 ($1)"; exit 0; }

          case "$EVENT" in
            push)
              case "$REF" in refs/tags/*) run_all "릴리스 태그" ;; esac
              BASE_SHA="$BEFORE" ;;
            pull_request) BASE_SHA="$BASE" ;;
            *) run_all "$EVENT" ;;
          esac

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            run_all "비교 기준 없음"
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            run_all "비교 기준 커밋을 찾을 수 없음"
          fi

          CHANGED="$(git -c core.quotePath=false diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "변경된 파일:"; echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            run_all "변경 파일 목록이 비어 있음"
          fi
          if printf '%s\n' "$CHANGED" | grep -qvE '^site/content/'; then
            run_all "앱 코드 변경 포함"
          fi

          echo "code=false" >> "$GITHUB_OUTPUT"
          echo "::notice::게시 문서(site/content/)만 바뀌어 앱 CI 를 건너뜁니다. 블로그 배포는 blog.yml 이 합니다."

  lint-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest (+ 커버리지 게이트)
        # 회귀 방지 하한선 — 현재 ~50%. 봇 통합 테스트가 늘면 상향 가능.
        run: uv run pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=45

      - name: pip-audit
        run: uv run pip-audit --strict

  smoke:
    runs-on: ubuntu-latest
    needs: lint-test
    # 주간 감사는 의존성·이미지 취약점을 보는 것이 목적이다. 컨테이너 기동까지
    # 매주 돌릴 이유는 없고, 코드가 바뀌면 그 푸시에서 이미 돈다.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # compose 의 env_file 이 요구하는 .env 를 가장 먼저 생성 — 이후 모든 docker compose
      # 명령(부팅·teardown)이 .env 를 찾도록. (없으면 teardown 이 실패해 진짜 원인을 가림)
      - name: Prepare .env (CI dummy)
        # worker-data 명명 볼륨이 appuser 소유라 sqlite/캐시 쓰기 OK — DATA_DIR 우회 불필요.
        # compose 의 :? 필수 변수(POSTGRES/GRAFANA 비밀번호)도 더미로 채워 파싱 통과
        run: printf 'TELEGRAM_TOKEN=ci-dummy\nTELEGRAM_CHAT_ID=0\nPOSTGRES_PASSWORD=ci-dummy\nGRAFANA_ADMIN_PASSWORD=ci-dummy\n' > .env

      # 1) dev 이미지 안에서 테스트 스위트 실행 — 봇 /test 경로(컨테이너 내 pytest 도구) 검증
      - name: Build dev worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-dev
          push: false
          load: true
          tags: devops-pipeline:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run test suite inside dev image
        # appuser(봇과 동일 권한)로 실행해 콘솔 스크립트 shebang·권한 경로를 그대로 검증.
        # -p no:cacheprovider: .pytest_cache 미생성 (마운트 쓰기 회피)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            devops-pipeline:dev pytest tests/ -q -p no:cacheprovider

      # 2) 컨테이너 부팅 + 자가점검 — 기동/Qdrant 연결/git ownership 등 통합 결함 검출
      - name: Boot worker + qdrant
        run: docker compose up -d --build qdrant worker

      - name: Wait for worker health
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T worker python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8766/health',timeout=2).status==200 else 1)" 2>/dev/null; then
              echo "worker healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::worker 가 기동되지 않음"; docker compose logs worker; exit 1

      - name: Self-check (db/git/qdrant 필수 통과)
        run: docker compose exec -T worker python /workspace/scripts/smoke_selfcheck.py

      - name: Teardown
        if: always()
        run: docker compose down -v

  container-build-scan:
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          tags: devops-pipeline:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: devops-pipeline:ci-${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: devops-pipeline:ci-${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 30

      - name: Trivy scan — CRITICAL (빌드 실패)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-pipeline:ci-${{ github.sha }}
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true
          format: table

      - name: Trivy scan — HIGH (보고만)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-pipeline:ci-${{ github.sha }}
          severity: HIGH
          exit-code: 0
          ignore-unfixed: true
          format: sarif
          output: trivy-high.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-high.sarif

  registry-push:
    runs-on: ubuntu-latest
    needs: container-build-scan
    if: github.event_name == 'push'   # PR 에서는 푸시 안 함
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vllm-build:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract vLLM image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vllm
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vLLM image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.vllm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
